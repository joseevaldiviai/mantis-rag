services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@db:5432/rag
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Define OPENAI_API_KEY en un archivo .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      FAISS_INDEX_DIR: /app/data/faiss
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_CREDENTIALS: ${GCS_CREDENTIALS:-}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  faiss_data:
